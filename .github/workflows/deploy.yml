name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  schedule:
    - cron: '0 7 * * *'  # 7 AM UTC — after Scryfall publishes nightly updates
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # For workflow_run: only deploy if CI passed. For schedule/dispatch: always run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Restore last known-good Scryfall data (fallback)
        uses: actions/cache/restore@v6
        with:
          path: |
            data/scryfall/sets-*.json.gz
            data/scryfall/default-cards-*.jsonl.gz
            data/scryfall/.sets-hash
          key: scryfall-data-fallback

      - name: Fetch Scryfall sets and compute hash
        id: sets
        run: |
          UA="box-packer/1.0 (github.com/${{ github.repository }})"
          mkdir -p data/scryfall
          DATE=$(date -u +%F)

          OLD_HASH=""
          [ -f data/scryfall/.sets-hash ] && OLD_HASH=$(cat data/scryfall/.sets-hash)

          if SETS_DATA=$(curl -sf -A "$UA" https://api.scryfall.com/sets \
            | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin)['data'], indent=2))"); then
            echo "$SETS_DATA" | gzip > "data/scryfall/sets-${DATE}.json.gz"
            echo "Fetched fresh Scryfall sets data."
          else
            echo "::warning::Failed to fetch fresh Scryfall sets data; falling back to last known-good cached copy."
          fi

          SETS_FILE=$(ls -t data/scryfall/sets-*.json.gz 2>/dev/null | head -1)
          if [ -z "$SETS_FILE" ]; then
            echo "::error::No Scryfall sets data available (fetch failed and no cached fallback found)."
            exit 1
          fi

          HASH=$(gzip -dc "$SETS_FILE" | sha256sum | cut -d' ' -f1)
          FILE_DATE=$(basename "$SETS_FILE" | sed -E 's/^sets-(.+)\.json\.gz$/\1/')
          echo "$HASH" > data/scryfall/.sets-hash
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "date=${FILE_DATE}" >> "$GITHUB_OUTPUT"
          echo "unchanged=$([ "$HASH" = "$OLD_HASH" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Download default-cards (sets changed or no cached data)
        env:
          SETS_UNCHANGED: ${{ steps.sets.outputs.unchanged }}
        run: |
          UA="box-packer/1.0 (github.com/${{ github.repository }})"
          DATE="${{ steps.sets.outputs.date }}"

          if [ "$SETS_UNCHANGED" = "true" ] && ls data/scryfall/default-cards-*.jsonl.gz >/dev/null 2>&1; then
            echo "Sets unchanged and cached default-cards data present; skipping download."
          else
            if DOWNLOAD_URI=$(curl -sf -A "$UA" https://api.scryfall.com/bulk-data \
              | python3 -c "
          import json, sys
          for item in json.load(sys.stdin)['data']:
              if item['type'] == 'default_cards':
                  print(item['jsonl_download_uri']); break
          "); then
              # jsonl_download_uri already points to a gzip-compressed .jsonl.gz file — download as-is.
              if curl -sf -L -A "$UA" "$DOWNLOAD_URI" -o "data/scryfall/default-cards-${DATE}.jsonl.gz.tmp"; then
                mv "data/scryfall/default-cards-${DATE}.jsonl.gz.tmp" "data/scryfall/default-cards-${DATE}.jsonl.gz"
              fi
            else
              echo "::warning::Failed to fetch fresh default-cards data; falling back to last known-good cached copy."
            fi
          fi

          if ! ls data/scryfall/default-cards-*.jsonl.gz >/dev/null 2>&1; then
            echo "::error::No default-cards data available (fetch failed and no cached fallback found)."
            exit 1
          fi
          echo "Using $(ls -t data/scryfall/default-cards-*.jsonl.gz | head -1)"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Scryfall data into public/
        run: npm run sync:data

      - name: Build project
        run: npm run build

      - name: Prune old Scryfall data files before caching
        if: always()
        run: |
          cd data/scryfall
          ls -t sets-*.json.gz 2>/dev/null | tail -n +2 | xargs -r rm --
          ls -t default-cards-*.jsonl.gz 2>/dev/null | tail -n +2 | xargs -r rm --

      - name: Delete previous fallback cache entry
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete scryfall-data-fallback --repo "${{ github.repository }}"

      - name: Save Scryfall data as fallback for future runs
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            data/scryfall/sets-*.json.gz
            data/scryfall/default-cards-*.jsonl.gz
            data/scryfall/.sets-hash
          key: scryfall-data-fallback

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
